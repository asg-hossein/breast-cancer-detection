name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Download dataset if missing
      run: |
        if [ ! -f "data/data.csv" ]; then
          mkdir -p data
          curl -s -o data/data.csv https://raw.githubusercontent.com/kying18/breast-cancer/master/data.csv
        fi

    - name: Run unit tests
      run: |
        python -m pytest tests/test_unit.py -v

    - name: Run API tests
      run: |
        python -m pytest tests/test_api.py -v

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linters
      run: |
        pip install black isort flake8

    - name: Check formatting
      run: |
        black --check api.py scripts/ tests/

    - name: Check imports
      run: |
        isort --check-only api.py scripts/ tests/

    - name: Run flake8
      run: |
        flake8 --max-line-length=100 --extend-ignore=E203,E266,E501,W503,F403,F401,E402,F541,F841,E722,F824 --max-complexity=15 api.py scripts/ tests/

  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate structure
      run: |
        [ -f api.py ] || (echo "api.py not found" && exit 1)
        [ -f requirements.txt ] || (echo "requirements.txt not found" && exit 1)
        [ -f README.md ] || (echo "README.md not found" && exit 1)
        [ -f .gitignore ] || (echo ".gitignore not found" && exit 1)

        [ -d tests ] || (echo "tests directory not found" && exit 1)
        [ -d scripts ] || (echo "scripts directory not found" && exit 1)

        [ -f scripts/config.py ] || (echo "config.py not found" && exit 1)
        [ -f scripts/data_processor.py ] || (echo "data_processor.py not found" && exit 1)
        [ -f scripts/model_trainer.py ] || (echo "model_trainer.py not found" && exit 1)
        [ -f scripts/evaluator.py ] || (echo "evaluator.py not found" && exit 1)
        [ -f scripts/utils.py ] || (echo "utils.py not found" && exit 1)
        [ -f scripts/main_pipeline.py ] || (echo "main_pipeline.py not found" && exit 1)

        [ -f tests/test_unit.py ] || (echo "test_unit.py not found" && exit 1)
        [ -f tests/test_api.py ] || (echo "test_api.py not found" && exit 1)

        echo "Structure validation completed"

    - name: Check file contents
      run: |
        [ -s README.md ] || (echo "README.md is empty" && exit 1)
        [ -s .gitignore ] || (echo ".gitignore is empty" && exit 1)
        [ -s requirements.txt ] || (echo "requirements.txt is empty" && exit 1)
        echo "File contents validation completed"
